# ─── API ──────────────────────────────────────────────
  api:
    build: ./api
    container_name: freelancer-api-saas
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # sadece localhost, 0.0.0.0 değil
    expose:
      - "8000"
    volumes:
      - ./api/app:/app/app
      - ./api/static:/app/static   # API ile ilgili statik dosyalar (örneğin, frontend build çıktısı)
      - ./data:/data        # Veritabanı ve diğer kalıcı veriler için


    depends_on:
      - ollama-cpu
    networks:
      - freelancer-net
    

