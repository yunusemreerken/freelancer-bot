volumes:
  n8n_storage:
  ollama_storage:
  open-webui:
  caddy-data:
  caddy-config:
  freelancer_data:
  
networks:
  freelancer-net:
    driver: bridge

x-n8n: &service-n8n
  image: n8nio/n8n:latest
  environment:
    - DB_TYPE=sqlite
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
    - WEBHOOK_URL=http://localhost:5678

x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama-saas
  restart: unless-stopped
  expose:
    - 11434/tcp
  environment:
    - OLLAMA_CONTEXT_LENGTH=512
    - OLLAMA_FLASH_ATTENTION=1
    - OLLAMA_MAX_LOADED_MODELS=1
  volumes:
    - ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  container_name: ollama-pull-model-saas
  volumes:
    - ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  command:
    - "-c"
    - "sleep 5; OLLAMA_HOST=ollama:11434 ollama pull phi3:mini"

services:

  # ─── LLM ──────────────────────────────────────────────
  ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama
    networks:
      - freelancer-net

  ollama-pull-llama-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - ollama-cpu

  # ─── WORKFLOW ─────────────────────────────────────────
  n8n:
    <<: *service-n8n
    container_name: n8n-saas
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/backup:/backup
      - ./shared:/data/shared
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
    networks:
      - freelancer-net

  # ─── CHAT UI ──────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    container_name: open-webui-saas
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data

  # ─── REVERSE PROXY ────────────────────────────────────
